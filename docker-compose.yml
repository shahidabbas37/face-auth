services:
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    container_name: face-auth-frontend
    ports:
      - "${WEB_PORT:-5173}:80"
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
    container_name: face-auth-backend
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      QDRANT_HOST: ${QDRANT_HOST:-qdrant}
      QDRANT_PORT: ${QDRANT_PORT:-6333}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-face_embeddings}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-local-development-only-change-me}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-60}
    depends_on:
      - qdrant

  qdrant:
    image: qdrant/qdrant:latest
    container_name: face-auth-qdrant
    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  qdrant_data: